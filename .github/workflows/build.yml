name: Build Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download FFmpeg
      run: |
        curl -L https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
        7z x ffmpeg.zip
        move ffmpeg-*-essentials_build\bin\ffmpeg.exe .

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name OfflineConverter --add-data "converters;converters" --add-binary "ffmpeg.exe;." --hidden-import PySide6.QtWidgets --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui --hidden-import pydub --hidden-import PIL --hidden-import PyPDF2 --hidden-import docx --hidden-import lxml app.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OfflineConverter-exe
        path: dist/OfflineConverter.exe